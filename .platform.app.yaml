# This file describes an application. You can have multiple applications
# in the same project.

# The name of this app. Must be unique within a project.
name: dashboard

# The type of the application to build.
type: php:8.0

build:
    flavor: none

dependencies:
    nodejs:
        npm: ^6
    php:
        composer/composer: ^2

variables:
    env:
        # Update these for your desired NVM and Node versions.
        NVM_VERSION: v0.39.0
        NODE_VERSION: v14.18.1

# The hooks that will be performed when the package is deployed.
hooks:
    build: |
        set -e
        composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader
        # https://docs.platform.sh/languages/nodejs/nvm.html#how-to-use-nvm-to-run-different-versions-of-nodejs
        unset NPM_CONFIG_PREFIX
        export NVM_DIR="$PLATFORM_APP_DIR/.nvm"
        # install.sh will automatically install NodeJS based on the presence of $NODE_VERSION
        curl -f -o- https://raw.githubusercontent.com/nvm-sh/nvm/$NVM_VERSION/install.sh | bash
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        curl -sS https://platform.sh/cli/installer | php
        php artisan config:clear
        php artisan clear-compiled
        php artisan storage:link
        npm ci
        npm run production
    deploy: |
        set -e
        php artisan clear-compiled
        php artisan config:cache
        php artisan route:trans:cache
        php artisan view:cache
        php artisan migrate --force
        php artisan google-fonts:fetch

crons:
    generate-statistics:
        # once per day at 00:55
        spec: "55 0 * * *"
        cmd: |
            if [ "$PLATFORM_BRANCH" = main ]; then
                php artisan statistics
            fi
    capture-kpis:
        # once per day at 01:20
        spec: "20 1 * * *"
        cmd: |
            if [ "$PLATFORM_BRANCH" = main ] || [ "$PLATFORM_BRANCH" = dev ]; then
                php artisan kpis
            fi
    hubspot-sync:
        # once per day at 06:20
        spec: "20 6 * * *"
        cmd: |
            if [ "$PLATFORM_BRANCH" = main ]; then
                php artisan hubspot:sync --f
            fi
    posthog-sync:
        # once per day at 06:50
        spec: "50 6 * * *"
        cmd: |
            if [ "$PLATFORM_BRANCH" = main ] || [ "$PLATFORM_BRANCH" = dev ]; then
                php artisan posthog:sync
            fi
    snapshot-once-per-day:
        # once per day at 12:00
        spec: "0 12 * * *"
        cmd: |
            if [ "$PLATFORM_BRANCH" = main ]; then
                platform backup:create --yes --no-wait --live
            fi

# The relationships of the application with services or other applications.
# The left-hand side is the name of the relationship as it will be exposed
# to the application in the PLATFORM_RELATIONSHIPS variable. The right-hand
# side is in the form `<service name>:<endpoint name>`.
relationships:
    database: "rdbms:mysql"

# The size of the persistent disk of the application (in MB).
disk: 2048

# The mounts that will be performed when the package is deployed.
mounts:
    "storage/app/public": "shared:files/public"
    "storage/framework/views": "shared:files/views"
    "storage/framework/sessions": "shared:files/sessions"
    "storage/framework/cache": "shared:files/cache"
    "storage/logs": "shared:files/logs"
    "bootstrap/cache": "shared:files/bootstrap/cache"
    "/.config": "shared:files/config"

# The configuration of app when it is exposed to the web.
web:
    commands:
        start: php artisan clear-compiled && php artisan config:cache && /usr/sbin/php-fpm8.0-zts
    locations:
        "/":
            root: "public"
            index:
                - index.php
            allow: true
            passthru: "/index.php"
            rules:
                "^/(css|js)/app.(css|js)":
                    expires: 2m

workers:
    queue:
        size: "S"
        commands:
            start: |
                php artisan queue:work --queue=high,medium,low,default
        disk: 256
        relationships:
            database: "rdbms:mysql"
