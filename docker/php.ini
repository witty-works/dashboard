; On top of php.ini-production. See docs/docker.md, "Production image".

; The code never changes inside a container, so OPcache never has to look at
; the files again after the first request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M

; Errors go to stderr, where the container log collects them.
log_errors = On
error_log = /dev/stderr
