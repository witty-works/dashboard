on: [push]
name: Build a Docker image and Push it to ACR
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # build dashboard
      - run: |
          docker build . -f ops/dashboard/Dockerfile -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/dashboard:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/dashboard:${{ github.sha }}
          # release version
          docker tag ${{ secrets.REGISTRY_LOGIN_SERVER }}/dashboard:${{ github.sha }} ${{ secrets.REGISTRY_LOGIN_SERVER }}/dashboard:${{ github.ref_name }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/dashboard:${{ github.ref_name }}
