name: release image

# Builds the Docker image for a release tag and publishes it to
# ghcr.io/witty-works/dashboard. The image holds no deployment configuration -
# everything is environment at runtime - so one image serves every
# deployment; pin it there by digest. See docs/docker.md, "Production image".
#
# The test suite does not run here: the tagged commit is the one merged to
# main, and ci.yaml tested it there.

on:
  push:
    # A release (1.43.0) or a release candidate (1.43.0-rc1).
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]
  # A rebuild of an existing tag, e.g. after a base image security fix. Run it
  # on the tag (the "Use workflow from" selector): on a branch there is no
  # version tag to check out, and the run fails.
  workflow_dispatch:
  # From the release workflow (release.yaml), whose tag starts no workflow.
  workflow_call:
    inputs:
      tag:
        description: The version tag to build, e.g. 2.0.0-rc1.
        type: string
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The tag being built: the release workflow's, or the one pushed or chosen.
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION }}
          # No later step uses git with the token: the build reads the
          # checkout as files. Left in .git/config, the token would be readable
          # by the build and whatever it runs.
          persist-credentials: false

      - name: Commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 1.43.0 and 1.43. No latest: it would move back to an older release
          # on a rebuild or a patch tag of an older line, and deployments pin
          # by digest anyway. A release candidate gets only its full version
          # (1.43.0-rc1), never 1.43.
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
          flavor: |
            latest=false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # APP_VERSION is the tag exactly as pushed, so the release Sentry is
      # told about (config/sentry.php) is the one the release workflow
      # creates under the same name.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ steps.commit.outputs.sha }}
            APP_VERSION=${{ env.VERSION }}

      - name: Digest
        run: |
          echo "### ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin it by digest: \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
